name: flutter_spaced_repetition
description: A pure Dart implementation of the SM-2 spaced repetition algorithm for Flutter apps. Perfect for flashcard apps, language learning, and any spaced learning application.
version: 1.0.0
homepage: https://github.com/makieali/flutter_spaced_repetition
repository: https://github.com/makieali/flutter_spaced_repetition
issue_tracker: https://github.com/makieali/flutter_spaced_repetition/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

# No dependencies - pure Dart!
dependencies: {}

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0

topics:
  - spaced-repetition
  - flashcards
  - learning
  - education
  - algorithm
